<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindred — Reconnecting Human Creativity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f7f5;
      --ink: #111111;
      --mute: #9a9a9a;
      --sub: #7b7b7b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      height: 100vh;
      min-height: 660px;
      overflow: hidden;
      background-color: var(--bg);
    }

    canvas#dots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    nav, .copy, .logos {
      position: relative;
      z-index: 3;
    }

    /* Nav */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(18px, 2.6vw, 40px);
      padding-top: 36px;
      font-size: 13.5px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 10px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .brand svg {
      width: 16px;
      height: 18px;
      fill: currentColor;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.6vw, 40px);
      list-style: none;
    }

    .nav-links a {
      color: #3a3a3a;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: #000;
    }

    .btn-signin {
      background: var(--ink);
      color: #fff;
      padding: 10px 21px;
      border-radius: 999px;
      font-weight: 500;
      text-decoration: none;
      margin-left: 10px;
      display: inline-block;
      transition: transform 0.25s ease, background-color 0.2s ease;
    }

    .btn-signin:hover {
      transform: translateY(-1px);
    }

    /* Copy block */
    .copy {
      position: absolute;
      left: 50%;
      top: 24.5%;
      transform: translateX(-50%);
      text-align: center;
      width: min(92vw, 720px);
      pointer-events: none;
    }

    .copy a {
      pointer-events: auto;
    }

    .copy h1 {
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.04;
      font-size: clamp(38px, 3.75vw, 68px);
    }

    .copy h1 .line-mute {
      display: block;
      color: var(--mute);
    }

    .copy h1 .line-ink {
      display: block;
      color: var(--ink);
    }

    .copy p {
      margin-top: 20px;
      margin-left: auto;
      margin-right: auto;
      max-width: 340px;
      color: var(--sub);
      font-size: clamp(13px, 1.02vw, 15.5px);
      line-height: 1.4;
    }

    .cta-wrapper {
      display: inline-block;
      position: relative;
      margin-top: clamp(34px, 3.6vw, 52px);
    }

    .cta-glow {
      position: absolute;
      left: 10%;
      right: 10%;
      bottom: -6px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(90deg, #ffcf5a, #7dffa8, #5ad7ff, #9b7bff, #ff6fd8, #ffb36b);
      filter: blur(9px);
      opacity: 0.85;
      transition: opacity 0.3s ease, filter 0.3s ease, bottom 0.3s ease;
      z-index: 1;
      pointer-events: none;
    }

    .btn-join {
      position: relative;
      z-index: 2;
      display: inline-block;
      background: var(--ink);
      color: #fff;
      font-size: 13.5px;
      font-weight: 500;
      text-decoration: none;
      padding: 11px 20px;
      border-radius: 999px;
      transition: transform 0.3s ease;
    }

    .cta-wrapper:hover .btn-join {
      transform: translateY(-1px);
    }

    .cta-wrapper:hover .cta-glow {
      opacity: 1;
      filter: blur(12px);
      bottom: -9px;
    }

    /* Partner logos */
    .logos {
      position: absolute;
      bottom: clamp(28px, 6vh, 64px);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(26px, 4.6vw, 66px);
      flex-wrap: wrap;
      padding: 0 16px;
      color: #8d8d8d;
      font-size: clamp(14px, 1.18vw, 17px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .logo-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .logo-item svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Responsive */
    @media (max-width: 760px) {
      nav {
        justify-content: space-between;
        padding: 22px 18px 0;
      }
      .nav-links {
        display: none;
      }
      .brand {
        margin-right: 0;
      }
      .btn-signin {
        margin-left: 0;
      }
      .copy {
        top: 20%;
      }
      .logos {
        gap: 14px 24px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <canvas id="dots"></canvas>

    <nav>
      <a href="#" class="brand">
        <svg viewBox="0 0 16 18">
          <path d="M2 0h4v18H2zM7 9c3-1 5-4 6-9h3c-1 5-3 8-6 9 3 1 5 4 6 9h-3c-1-5-3-8-6-9z"/>
        </svg>
        <span>Kindred</span>
      </a>

      <ul class="nav-links">
        <li><a href="#">Platform</a></li>
        <li><a href="#">Marketplace</a></li>
        <li><a href="#">Creators</a></li>
        <li><a href="#">Resources</a></li>
        <li><a href="#">Company</a></li>
      </ul>

      <a href="#" class="btn-signin">Sign In</a>
    </nav>

    <div class="copy">
      <h1>
        <span class="line-mute">Reconnecting</span>
        <span class="line-ink">Human Creativity.</span>
      </h1>
      <p>We’re not building another platform. We’re building a place where people belong.</p>
      <div class="cta-wrapper">
        <div class="cta-glow"></div>
        <a href="#" class="btn-join">Join the circle</a>
      </div>
    </div>

    <div class="logos">
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M3 15c0-7 5-12 14-12-1 9-6 14-13 13l-1 2-2-1z"/>
        </svg>
        <span>Lumenix</span>
      </div>
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M10 1l8 4.5v9L10 19l-8-4.5v-9zM10 6l-4 2.3v4.4L10 15l4-2.3V8.3z"/>
        </svg>
        <span>Velora</span>
      </div>
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M1 5q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0zm0 7q4.5-3 9 0t9 0v3q-4.5 3-9 0t-9 0z"/>
        </svg>
        <span>Nimbus</span>
      </div>
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M10 1a9 9 0 110 18 9 9 0 010-18zm0 3a6 6 0 100 12 6 6 0 000-12zm0 3a3 3 0 110 6 3 3 0 010-6z"/>
        </svg>
        <span>Quanta</span>
      </div>
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M1 17L7 6l3 5 3-7 6 13z"/>
        </svg>
        <span>Solstice</span>
      </div>
      <div class="logo-item">
        <svg viewBox="0 0 20 20">
          <path d="M10 1l9 4-9 4-9-4zm-9 8l9 4 9-4v3l-9 4-9-4zm0 5l9 4 9-4v2l-9 4-9-4z"/>
        </svg>
        <span>Parallax</span>
      </div>
    </div>
  </section>

  <script>
    (function () {
      const canvas = document.getElementById('dots');
      const ctx = canvas.getContext('2d');

      const SHEET_URL = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_025250_100df7b8-31fd-4614-aa4a-c1b7d5b6b273.png&w=1600&q=85';

      const RECTS = {
        LA: [0, 0.06, 0.47, 0.40],
        RA: [0.53, 0.06, 0.47, 0.40],
        LB: [0, 0.55, 0.47, 0.40],
        RB: [0.53, 0.55, 0.47, 0.40]
      };

      const TILES = {};
      let tilesReady = false;

      // Offscreen field canvases for sampling luminance
      const fA = document.createElement('canvas');
      const ctxA = fA.getContext('2d', { willReadFrequently: true });
      const fB = document.createElement('canvas');
      const ctxB = fB.getContext('2d', { willReadFrequently: true });

      let W = 0, H = 0, DPR = 1;
      let step = 7, rowStep = 14;
      let cols = 0, rows = 0;
      let R = 3;
      let seeds = null;

      function hash(a, b) {
        const val = Math.sin(a * 127.1 + b * 311.7) * 43758.5453123;
        return val - Math.floor(val);
      }

      function smooth(a, b, x) {
        const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }

      function mixAt(t, on, off, dur) {
        return smooth(on, on + dur, t) * (1 - smooth(off, off + dur, t));
      }

      // Load image and prepare high-quality sliced tiles
      const sheet = new Image();
      sheet.crossOrigin = 'anonymous';
      sheet.onload = () => {
        const nw = sheet.naturalWidth || 1600;
        const nh = sheet.naturalHeight || 905;
        const targetTileW = 420;

        for (const key of ['LA', 'RA', 'LB', 'RB']) {
          const [rx, ry, rw, rh] = RECTS[key];
          const sx = rx * nw;
          const sy = ry * nh;
          const sw = rw * nw;
          const sh = rh * nh;
          const aspect = sh / sw;
          const targetTileH = Math.round(targetTileW * aspect);

          const tCanvas = document.createElement('canvas');
          tCanvas.width = targetTileW;
          tCanvas.height = targetTileH;
          const tCtx = tCanvas.getContext('2d');
          tCtx.imageSmoothingQuality = 'high';
          tCtx.drawImage(sheet, sx, sy, sw, sh, 0, 0, targetTileW, targetTileH);
          TILES[key] = tCanvas;
        }
        tilesReady = true;
      };
      sheet.src = SHEET_URL;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(2, window.devicePixelRatio || 1);

        canvas.width = W * DPR;
        canvas.height = H * DPR;

        step = Math.max(5, W / 205);
        rowStep = step * 2.05;
        cols = Math.ceil(W / step);
        rows = Math.ceil(H / rowStep);
        R = step * 0.46;

        fA.width = cols;
        fA.height = rows;
        fB.width = cols;
        fB.height = rows;

        seeds = new Float32Array(cols * rows);
        for (let j = 0; j < rows; j++) {
          const rowNoise = hash(j * 3.1, 7.7);
          for (let i = 0; i < cols; i++) {
            seeds[j * cols + i] = 0.55 * hash(i, j) + 0.45 * rowNoise;
          }
        }
      }

      window.addEventListener('resize', resize);
      resize();

      const LOOP = 20;
      const LEVELS = [0, 0.26, 0.52, 0.78, 1];

      function render(timeSeconds) {
        const t = ((timeSeconds % LOOP) + LOOP) % LOOP;
        const a = (2 * Math.PI * t) / LOOP;

        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);

        if (!tilesReady || cols === 0 || rows === 0) {
          return;
        }

        // 1. Prepare fields fA and fB
        ctxA.fillStyle = '#ffffff';
        ctxA.fillRect(0, 0, cols, rows);
        ctxB.fillStyle = '#ffffff';
        ctxB.fillRect(0, 0, cols, rows);

        const isPortrait = H > W;
        const hw = isPortrait ? W * 0.66 : W * 0.53;
        const hh = hw * ((0.40 * 1520) / (0.47 * 2688));
        const cy = isPortrait ? H * 0.66 : H * 0.54;

        // Draw hands into both fields
        for (let handIdx = 0; handIdx < 2; handIdx++) {
          const isLeft = handIdx === 0;
          const ph = isLeft ? 0 : Math.PI;

          const reach = (0.035 * Math.sin(a + ph) + 0.012 * Math.sin(2 * a + 1.3 + ph)) * W;
          const scale = 1 + 0.07 * Math.sin(a + 0.9 + ph);
          const rot = (isLeft ? 1 : -1) * 0.045 * Math.sin(a + 2.1 + ph);

          let x = isLeft ? (reach - W * 0.045) : (W - hw + W * 0.045 - reach);
          const pivotX = isLeft ? 0 : W;
          const pivotY = cy;

          // Helper to apply hand transform to an offscreen context
          const applyHandTransform = (targetCtx) => {
            targetCtx.save();
            targetCtx.scale(cols / W, rows / H);
            targetCtx.translate(pivotX, pivotY);
            targetCtx.rotate(rot);
            targetCtx.scale(scale, scale);
            targetCtx.translate(-pivotX, -pivotY);
          };

          // Draw Pose A into fA
          applyHandTransform(ctxA);
          ctxA.drawImage(isLeft ? TILES.LA : TILES.RA, x, cy - hh / 2, hw, hh);
          ctxA.restore();

          // Draw Pose B into fB
          applyHandTransform(ctxB);
          ctxB.drawImage(isLeft ? TILES.LB : TILES.RB, x, cy - hh / 2, hw, hh);
          ctxB.restore();
        }

        const imgDataA = ctxA.getImageData(0, 0, cols, rows).data;
        const imgDataB = ctxB.getImageData(0, 0, cols, rows).data;

        // Transitions (Glitch Dissolve)
        const mL = mixAt(t, 6.2, 14.6, 1.6);
        const mR = mixAt(t, 2.4, 10.4, 1.6);

        const tick = Math.floor(t * 7);

        // Precompute row shift glitches
        const rowShifts = new Int32Array(rows);
        for (let j = 0; j < rows; j++) {
          if (hash(j, tick) > 0.965) {
            rowShifts[j] = Math.round((hash(tick, j) - 0.5) * 8);
          } else {
            rowShifts[j] = 0;
          }
        }

        ctx.fillStyle = '#0d0d0d';
        ctx.beginPath();

        const quietWidth = isPortrait ? 0.44 : 0.2;
        const quietCenterY = isPortrait ? 0.33 : 0.385;

        for (let j = 0; j < rows; j++) {
          const shift = rowShifts[j];
          const rowY = (j + 0.5) * rowStep;
          const ey = (rowY / H - quietCenterY) / 0.085;

          for (let i = 0; i < cols; i++) {
            const seed = seeds[j * cols + i];
            const isLeftHalf = i < cols / 2;
            const m = isLeftHalf ? mL : mR;
            const useB = seed < m;

            // Apply horizontal row-glitch shift
            let sampleI = i - shift;
            if (sampleI < 0) sampleI = 0;
            if (sampleI >= cols) sampleI = cols - 1;

            const pixelIdx = (j * cols + sampleI) * 4;
            const lum = (useB ? imgDataB[pixelIdx] : imgDataA[pixelIdx]) / 255;

            let v = (1 - lum - 0.16) / 0.42;
            if (v < 0) v = 0;
            else if (v > 1) v = 1;

            if (v <= 0.001) continue;

            // Dissolve front thinning & sparkle
            if (m > 0.001 && m < 0.999) {
              const diff = Math.abs(seed - m);
              if (diff < 0.12) {
                v *= (diff / 0.12);
                if (hash(i + tick, j) <= 0.4) {
                  v *= 0.3;
                }
              }
            }

            // Shimmer
            v *= 0.86 + 0.14 * Math.sin(t * 3.2 + seed * 40);

            // Centre fade (fingertips dissolve before meeting)
            const cx = Math.abs((i + 0.5) / cols - 0.5);
            v *= smooth(0.035, 0.11, cx);

            // Copy quiet zone
            const ex = cx / quietWidth;
            v *= smooth(0.85, 1.25, Math.hypot(ex, ey));

            if (v <= 0.001) continue;

            // Quantise to LED levels
            let level = 0;
            for (let k = LEVELS.length - 1; k >= 0; k--) {
              if (v >= LEVELS[k] - 0.13) {
                level = LEVELS[k];
                break;
              }
            }

            if (level === 0) continue;

            let radius = R * level;
            if (level === LEVELS[1]) {
              radius = R * 0.38; // pinpoint dots
            }

            const posX = (i + 0.5) * step;
            ctx.moveTo(posX + radius, rowY);
            ctx.arc(posX, rowY, radius, 0, Math.PI * 2);
          }
        }

        ctx.fill();
      }

      window.__render = render;

      const t0 = performance.now();
      function loop(now) {
        render((now - t0) / 1000);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
